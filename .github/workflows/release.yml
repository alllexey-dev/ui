name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  npm:
    # Trusted publishing (OIDC): configure it on npmjs.com, then set the repository variable NPM_PUBLISH=true.
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check that the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm publish --access public
